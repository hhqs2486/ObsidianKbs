name: 30 天 Agent 打卡
description: 参与 30 天 Agent 工程化学习打卡
title: "[30天打卡] 第 "
labels:
  - check-in
  - community
body:
  - type: markdown
    attributes:
      value: |
        Fork 本仓库，按 Stage 1–8 学习，在本 Issue 记录每日进度。
        参考：[stage-8/README.md](../../stage-8/README.md)
  - type: input
    id: day
    attributes:
      label: 第几天（1-30）
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 今日学习的 Stage
      options:
        - stage-1
        - stage-2
        - stage-3
        - stage-4
        - stage-5
        - stage-6
        - stage-7
        - stage-8
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 今日完成内容
      description: 可附 commit / PR 链接，或粘贴 `python3 scripts/hub_progress.py status` 输出
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: 卡点或问题（可选）
