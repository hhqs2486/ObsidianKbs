name: 新手任务
description: 适合第一次贡献的小任务
title: "[新手任务] "
labels:
  - good first issue
  - help wanted
body:
  - type: markdown
    attributes:
      value: |
        感谢贡献！入门指南见 [CONTRIBUTING.md](../../CONTRIBUTING.md)。
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 完成时应达到什么效果？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 涉及哪些文件或 stage（尽量小）
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎样算完成？例如需要跑哪些 smoke test
